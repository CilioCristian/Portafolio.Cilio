<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./src/css/style.css">

    <title>Portafolio | Cristian Cilio</title>
</head>

<body class="windows_body">

    <!-- ================= ESCRITORIO ================= -->
    <main class="escritorio">
        <!-- Iconos -->
        <section class="iconos_escritorio">
            <button class="boton_escritorio" id="sobre_mi">
                <img src="./src/assets/iconos/sobre-mi.png" alt="Sobre mí">
                <span>Sobre mí</span>
            </button>
            <button class="boton_escritorio" id="proyectos">
                <img src="./src/assets/iconos/proyectos.png" alt="Proyectos">
                <span>Proyectos</span>
            </button>
            <button class="boton_escritorio" id="habilidades">
                <img src="./src/assets/iconos/habilidades.png" alt="Habilidades">
                <span>Habilidades</span>
            </button>
            <button class="boton_escritorio" id="curriculum">
                <img src="./src/assets/iconos/cv.png" alt="Currículum">
                <span>Currículum</span>
            </button>
        </section>
        <!-- ================= CONTENEDOR DE VENTANAS ================= -->
        <section class="contenedor_ventanas">

        </section>
    </main>

    <!-- ================= BARRA DE TAREAS ================= -->
    <footer class="barra_inferior">

    <!-- ================= BARRA INFERIOR IZQUIERDA ================= -->

    <div class="barra_inferior_izquierda">

        
    </div>
 <!-- ================= BARRA INFERIOR CENTRAL ================= -->

    <div class="barra_inferior_central">

        <button class="boton-windows"> <img src="./src/images/windows.png" alt="icon-windows"></button>

        <button class="boton_busqueda"> 

            <div class="busqueda_lupa">
                <img src="./src/images/lupa.png" alt="icon-Buscar">
            </div>
            <div class="busqueda_texto">
                <span>Search</span>
            </div>
            <div class="busqueda_tigre">
                <img src="./src/images/tigre.png" alt="icon-tigre">
            </div>
            
        </button>

        <button class="boton-copilot"> <img src="./src/images/copilot.png" alt="icon-copilot"></button>

        <button class="boton-chrome"> <img src="./src/images/chrome.png" alt="icon-chrome"></button>

        <button class="boton-carpeta"> <img src="./src/images/carpeta.png" alt="icon-carpeta"></button>
        
    </div>

 <!-- ================= BARRA INFERIOR DERECHA ================= -->

    <div class="barra_inferior_derecha">

    </div>

    </footer>

</body>

</html>
